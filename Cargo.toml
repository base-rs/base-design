[package]
name = "base-design"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/base-rs/base-design"
description = "Project design requirements and agent skills for authoring and review"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]
